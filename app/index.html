<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f4f2">
<title>显影 · 传讯字卡</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="./css/theme.css">
<link rel="stylesheet" href="./css/base.css">
<link rel="stylesheet" href="./css/anim.css">
<link rel="stylesheet" href="./css/page-decks.css">
<link rel="stylesheet" href="./css/page-settings.css">
<link rel="stylesheet" href="./css/gift-card.css">
<link rel="stylesheet" href="./css/page-chat.css">
<link rel="stylesheet" href="./css/page-starmap.css">
</head>
<body>

<canvas id="sky" aria-hidden="true"></canvas>
<canvas id="aur" aria-hidden="true"></canvas>

<div id="halo" aria-hidden="true">
  <div class="hl" id="hSky"></div>
  <div class="hl" id="hRays"></div>
  <div class="hl" id="hFill"></div>
  <div class="hl" id="hRim"></div>
  <svg class="hl ring" id="rOuter" viewBox="-100 -100 200 200">
    <circle r="98" stroke-width=".6"/>
    <circle r="92" stroke-width="1" stroke-dasharray="1 5"/>
    <g id="ticks"></g>
    <circle r="84" stroke-width=".5"/>
  </svg>
  <svg class="hl ring" id="rMid" viewBox="-100 -100 200 200">
    <circle r="96" stroke-width=".7"/>
    <polygon points="0,-90 63.6,-63.6 90,0 63.6,63.6 0,90 -63.6,63.6 -90,0 -63.6,-63.6" stroke-width=".5" opacity=".55"/>
    <path id="octa" stroke-width=".7"/>
    <g id="mdots"></g>
  </svg>
  <svg class="hl ring" id="rInner" viewBox="-100 -100 200 200">
    <circle r="94" stroke-width="1.1" stroke-dasharray=".5 3.5"/>
    <circle r="78" stroke-width=".6"/>
    <circle r="40" stroke-width=".5" opacity=".7"/>
  </svg>
  <div class="hl" id="hCore"></div>
</div>

<div id="veil" aria-hidden="true"></div>

<div id="app">
  <section class="page" data-page="chat" id="pageChat" tabindex="-1">
    <div class="col">
      <header class="top">
        <div class="top-nav">
          <button class="tbtn" id="btnStarmap" type="button" aria-label="查看星图与历史">星图</button>
          <i class="top-sep"></i>
          <span id="sessNo">No.----</span>
        </div>
        <span class="sp"></span>
        <button class="tbtn" id="btnReveal" type="button" aria-label="按住显影" aria-pressed="false">显影</button>
        <button class="tbtn" id="btnSendAway" type="button">送走</button>
        <button class="tbtn" id="btnTheme" type="button" aria-label="切换深浅色"><i class="moon"></i></button>
        <button class="tbtn" id="btnSettings" type="button">设置</button>
      </header>
      <div class="stage">
        <div class="scroll">
          <div class="inner">
            <div class="hist" id="hist"></div>
            <div class="now" id="now">
              <div class="gaze-ripple-wrap" id="gazeRipples" aria-hidden="true">
                <div class="rip r1"></div>
                <div class="rip r2"></div>
                <div class="rip r3"></div>
              </div>
              <input class="say-in" id="say" type="text" autocomplete="off" aria-label="在板上书写">
              <div class="line" id="line"></div>
              <div class="my-draft" id="myDraft" hidden></div>
            </div>
          </div>
        </div>
        <div class="cw"><canvas id="cvCandle"></canvas></div>
      </div>
      <div class="pend" id="pend"></div>
      <div class="ctl">
        <button class="cb" id="btnPlace" type="button" disabled>放上板</button>
        <i class="sep"></i>
        <button class="cb" id="btnHand" type="button" disabled>递出</button>
      </div>
    </div>
  </section>

  <section class="page" data-page="settings" id="pageSettings" tabindex="-1" hidden>
    <div class="col">
      <header class="s-bar">
        <button class="tbtn" id="btnBack" type="button">返回</button>
        <span class="s-title">设置</span>
      </header>
      <div class="s-scroll">
        <div class="s-inner" id="settingsBody"></div>
      </div>
    </div>
  </section>

  <section class="page" data-page="decks" id="pageDecks" tabindex="-1" hidden>
    <div class="col">
      <header class="s-bar">
        <button class="tbtn" id="btnDecksBack" type="button">返回</button>
        <span class="s-title">牌堆</span>
        <span class="sp"></span>
        <button class="tbtn" id="btnDecksTheme" type="button" aria-label="切换深浅色"><i class="moon"></i></button>
      </header>
      <div class="d-scroll">
        <div class="d-inner">
          <div class="sum" id="deckSum"></div>
          <div id="deckList"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="page" data-page="starmap" id="pageStarmap" tabindex="-1" hidden>
    <canvas id="smCanvas" tabindex="0" aria-label="星图：拖动旋转星盘，左右方向键在会话之间切换"></canvas>
    <div class="col">
      <header class="sm-top">
        <button class="sm-back" id="btnStarmapBack" type="button" aria-label="返回对话">‹ 返回</button>
        <i class="sep"></i>
        <span class="sm-ttl">星图</span>
        <i class="sep"></i>
        <span class="sm-cnt" id="smCnt">共 0 场会话</span>
        <span class="sp"></span>
        <button class="theme-btn" id="btnStarmapTheme" type="button" aria-label="切换深浅色"><i class="moon"></i></button>
      </header>

      <div class="sm-toast" id="smToast" aria-live="polite">
        <span class="k">一颗新星显影</span>
        <span class="v" id="smToastV"></span>
      </div>

      <div class="starmap-stage" id="starmapStage">
        <div class="sm-empty" id="smEmpty" hidden>
          <span class="t">还没有星辰显影</span>
          <span class="now" id="smNow"><i></i>此刻 · 子时方位</span>
          <small>完成一次会话并「送走」后，它会化作流星<br>浑仪随之合拢成星盘，第一颗星落进这枚星位</small>
          <button class="sm-go" id="smEmptyGo" type="button">开始一场会话</button>
        </div>
        <div class="foot" id="smFoot">
          <span class="hint" id="smHint">拖动旋转　上下俯仰　轻点星辰</span>
          <div class="legend">
            <span class="g"><i class="d" style="width:3px;height:3px"></i><i class="d" style="width:7px;height:7px"></i>消息数</span>
            <i class="sep"></i>
            <span class="g"><i class="d" style="width:5px;height:5px;opacity:.35"></i><i class="d" style="width:5px;height:5px"></i>越亮越近</span>
            <i class="sep"></i>
            <span class="g">方位即时辰</span>
          </div>
        </div>
      </div>

      <div class="card" id="smCard" role="dialog" aria-labelledby="smCno" hidden>
        <div class="in" id="smCardIn">
          <div class="ch">
            <span class="cn">No.</span>
            <span class="cno" id="smCno">----</span>
            <span class="sp"></span>
            <button class="ab" id="smCardClose" type="button">收起</button>
          </div>
          <div class="ct" id="smMeta"></div>
          <div class="cm"><span id="smMsg"></span><i class="sep"></i><span id="smDur"></span><i class="sep"></i><span id="smDeck"></span></div>
        </div>
        <div class="ca">
          <button class="cb" id="smBtnReplay" type="button">回放</button>
          <i class="sep"></i>
          <button class="cb" id="smBtnView" type="button">展开全篇</button>
        </div>
      </div>
    </div>
  </section>
</div>

<div class="ov" id="ovPaste" role="dialog" aria-modal="true" aria-labelledby="pTitle" hidden>
  <div class="ovc">
    <div class="ov-top">
      <span class="ov-ttl" id="pTitle">粘贴导入<small id="pDeck">· 字卡</small></span>
      <span class="ov-sp"></span>
      <button class="ov-tbtn" id="pCancel" type="button">取消</button>
    </div>
    <div class="hint">一行一张，空行忽略；也可贴 JSON</div>
    <textarea class="ta" id="pta" spellcheck="false" placeholder="把字贴在这里" aria-label="粘贴内容"></textarea>
    <div class="fb" id="pFb"></div>
    <div class="ctl">
      <button class="cb" id="pReplace" type="button" disabled>替换现有</button>
      <button class="cb solid" id="pAppend" type="button" disabled>追加</button>
    </div>
  </div>
</div>

<div class="ov" id="ovImg" role="dialog" aria-modal="true" aria-labelledby="iTitle" hidden>
  <div class="ovc">
    <div class="ov-top">
      <span class="ov-ttl" id="iTitle">选图导入<small id="iDeck">· 字卡</small></span>
      <span class="ov-sp"></span>
      <button class="ov-tbtn" id="iCancel" type="button">取消</button>
    </div>
    <div class="hint">图片只存在这台设备里</div>
    <div class="cnt"><span id="iCnt">已选 0 张</span><small>最多 60 张</small></div>
    <div class="gw"><div id="iGrid"><button class="add" id="iAdd" type="button"><span>选图</span></button></div></div>
    <div class="ctl">
      <button class="cb" id="iReplace" type="button" disabled>替换现有</button>
      <button class="cb solid" id="iAppend" type="button" disabled>追加</button>
    </div>
  </div>
</div>
<div class="ov" id="ovGift" role="dialog" aria-modal="true" aria-labelledby="gTitle" hidden>
  <div class="ovc">
    <div class="ov-top">
      <span class="ov-ttl" id="gTitle">加一张礼物<small>· 特殊卡</small></span>
      <span class="ov-sp"></span>
      <button class="ov-tbtn" id="gCancel" type="button">取消</button>
    </div>
    <div class="gscroll">
      <div class="flbl"><span>选一个图形</span><span id="gPick">已选：花束</span></div>
      <div class="igrid" id="gGrid" role="radiogroup" aria-label="礼物预设图形"></div>
      <div class="flbl"><span>名字</span><span id="gNameCnt">0 / 12</span></div>
      <input class="inp" id="gName" type="text" placeholder="花束" aria-label="礼物名字" spellcheck="false">
      <div class="flbl"><span>含义</span><span id="gMeanCnt">0 / 200</span></div>
      <textarea class="ta gift-ta" id="gMeaning" placeholder="写给这张卡的一句话" aria-label="礼物含义" spellcheck="false"></textarea>
      <div class="fsub"><span>只有你自己看得到</span></div>
      <div class="fb" id="gFb"></div>
    </div>
    <div class="ctl">
      <button class="cb solid" id="gAppend" type="button" disabled>追加</button>
    </div>
  </div>
</div><input type="file" id="iFile" accept="image/*" multiple hidden>

<div class="ov" id="ovAll" role="dialog" aria-modal="true" aria-labelledby="aTitle" hidden>
  <div class="ovc">
    <div class="ov-top">
      <span class="ov-ttl" id="aTitle">全部卡牌<small id="aDeck">· 字卡</small></span>
      <span class="ov-sp"></span>
      <button class="ov-tbtn" id="aClose" type="button">关闭</button>
    </div>
    <div class="cnt"><span id="aCnt">共 0 张</span><small>按导入顺序</small></div>
    <div class="gw" id="aList"></div>
  </div>
</div>

<div class="ov" id="ovSession" role="dialog" aria-modal="true" aria-labelledby="sessTitle" hidden>
  <div class="ovc">
    <div class="ov-top">
      <span class="ov-ttl" id="sessTitle">会话详情</span>
      <span class="ov-sp"></span>
      <button class="ov-tbtn" id="sessClose" type="button">关闭</button>
    </div>
    <div class="sess-replay-bar" id="sessReplayBar" hidden>
      <button class="sess-play-btn" id="sessPlayBtn" type="button">播放</button>
      <div class="sess-track" id="sessTrack">
        <div class="sess-fill" id="sessFill"></div>
        <div class="sess-knob" id="sessKnob"></div>
      </div>
      <span class="sess-clk" id="sessClk">00:00</span>
    </div>
    <div class="sess-body">
      <div class="sess-hist" id="sessHist"></div>
    </div>
  </div>
</div>

<div id="ritual">
  <canvas id="cvBig"></canvas>
  <div class="rt" id="rt">连接中</div>
  <div class="rs" id="rs">纯随机，没有 AI</div>
  <button class="again" id="btnAgain" type="button">再点一支蜡烛</button>
</div>

<noscript><p class="noscript">这个页面需要 JavaScript 才能运行。</p></noscript>

<script src="./js/rng.js"></script>
<script src="./js/starfield.js"></script>
<script src="./js/candle.js"></script>
<script src="./js/storage.js"></script>
<script src="./js/db.js"></script>
<script src="./js/deck-builtin.js"></script>
<script src="./js/gift-icons.js"></script>
<script src="./js/gift-card.js"></script>
<script src="./js/engine.js"></script>
<script src="./js/chat.js"></script>
<script src="./js/ui.js"></script>
<script src="./js/sfx.js"></script>
<script src="./js/decks.js"></script>
<script src="./js/settings.js"></script>
<script src="./js/starmap.js"></script>
<script src="./js/app.js"></script>
</body>
</html>
